<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Day 29</title>
</head>
<body>
    <h1>Inheritance And Encapsulation</h1>
    <script>
        class BankAccount{
            #balance = 5000;
            showBalance(){
                console.log(this.#balance);
            }
        }
        let account = new BankAccount();
        account.showBalance();
    </script>
</body>
</html>

<body>
    <h1>Promises</h1>
    <script>
       Promise.resolve(10)
       .then(num =>{
        return num * 2;
       })
       .then(num =>{
        return num + 5;
       })
       .then(result =>{
        console.log(result);
       });
    </script>
</body>
